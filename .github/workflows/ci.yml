name: CI

on:
  push:
    branches: [ main, 'rediseño-ui-local' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Release
        shell: cmd
        run: build.bat

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pst-password-recovery-win-x86
          path: |
            dist/PST_PasswordRecovery.exe
            dist/PST_PasswordRecovery.exe.sha256
            dist/PST_PasswordRecovery_v*.zip
            dist/PST_PasswordRecovery_v*.zip.sha256
          if-no-files-found: error
