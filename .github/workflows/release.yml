name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build
        shell: cmd
        run: build.bat

      - name: Extract version and prepare assets
        id: meta
        shell: pwsh
        run: |
          $asm = Get-Content Properties\AssemblyInfo.cs -Raw -Encoding UTF8
          $m = [regex]::Match($asm, 'AssemblyFileVersion\("(\d+\.\d+\.\d+)')
          if (-not $m.Success) { throw "Could not find AssemblyFileVersion in Properties\AssemblyInfo.cs" }
          $version = $m.Groups[1].Value
          $tag = "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pst-password-recovery-${{ steps.meta.outputs.tag }}
          path: |
            dist/PST_PasswordRecovery.exe
            dist/PST_PasswordRecovery.exe.sha256
            dist/PST_PasswordRecovery_v${{ steps.meta.outputs.version }}.zip
            dist/PST_PasswordRecovery_v${{ steps.meta.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Bump AssemblyFileVersion instead of replacing a published release." }

          $exeFile = "dist\PST_PasswordRecovery.exe"
          $zipFile = "dist\PST_PasswordRecovery_v$version.zip"
          $files = @($exeFile, $zipFile)
          $exeHash = (Get-FileHash $exeFile -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashes = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$(Split-Path $f -Leaf)" | Set-Content "$f.sha256" -Encoding ascii -NoNewline
            "- ``$(Split-Path $f -Leaf)``: ``$hash``"
          }

          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $version" }

          @"
          $($m.Groups[1].Value.Trim())

          ### Descargas / Downloads
          | Archivo | Para qué |
          |---|---|
          | ``PST_PasswordRecovery.exe`` | Ejecutable portátil único (WPF, .NET Framework 4.0 x86). |
          | ``PST_PasswordRecovery_v$version.zip`` | Paquete portátil completo con ejecutable, licencia e instrucciones. |

          **SHA-256** (también en los archivos ``.sha256``)
          $($hashes -join "`n")

          - **VirusTotal (`.exe`):** https://www.virustotal.com/gui/file/$exeHash

          Requisitos: Windows 10 / 11 (.NET Framework 4.0 o superior incluido en Windows).
          "@ | Set-Content notes.md -Encoding utf8

          $sha = git rev-parse HEAD
          $assets = $files + ($files | ForEach-Object { "$_.sha256" })
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $sha --title "PST Password Recovery $version" --notes-file notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
